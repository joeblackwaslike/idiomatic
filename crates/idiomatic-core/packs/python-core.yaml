name: python-core
language: python
version: 0.1.0
---
id: compare-none
language: python
title: "Use `is None` instead of `== None`"
why: "None is a singleton; identity comparison is correct, faster, and idiomatic."
severity: warn
fix_policy: autofix
rule:
  all:
    - pattern: "$X == None"
    # Guard: do not match inside a chained comparison like `a == None == b`,
    # which ast-grep would corrupt by dropping the trailing operand.
    - not:
        pattern: "$A == None == $B"
fix: "$X is None"
skill_prose: |
  Compare with `is None` / `is not None`, never `== None`. `None` is a singleton,
  so identity is what you actually mean, and `==` can be overridden by `__eq__`.
examples:
  bad: "if x == None:\n    pass"
  good: "if x is None:\n    pass"
---
id: negated-in
language: python
title: "Use `not in` instead of `not x in y`"
why: "`not in` is a single operator that reads naturally; `not (x in y)` is noisier."
severity: warn
fix_policy: autofix
rule:
  pattern: "not $X in $Y"
fix: "$X not in $Y"
examples:
  bad: "if not key in mapping:\n    pass"
  good: "if key not in mapping:\n    pass"
---
id: print-debugging
language: python
title: "Use logging instead of `print` for diagnostics"
why: "print() can't be filtered, leveled, or routed; logging can. There is no single safe rewrite."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "print($$$ARGS)"
skill_prose: |
  Reach for the `logging` module instead of `print` for anything diagnostic.
  Get a module logger with `logger = logging.getLogger(__name__)` and call
  `logger.debug(...)` / `logger.info(...)` so output can be leveled and routed.
examples:
  bad: "print(\"value is\", value)"
  good: "logger.debug(\"value is %s\", value)"
---
id: flatten-nesting
language: python
title: "Flatten deep nesting with guard clauses"
why: "More than ~3 levels of nesting is a readability smell; early returns flatten it. Judgment call, no detector."
severity: info
fix_policy: skill-only
skill_prose: |
  When a function nests more than about three levels deep, invert conditions and
  return early (guard clauses) so the happy path stays at the left margin. This is
  a judgment call — there is no mechanical rewrite, so it is taught, not enforced.
---
id: mutable-default-arg
language: python
title: "Don't use a mutable default argument (`=[]` / `={}`)"
why: "A default list/dict is created once and shared across all calls, so mutations leak between invocations — a classic footgun. There is no single safe rewrite (intent varies)."
severity: warn
fix_policy: warn-and-instruct
rule:
  kind: default_parameter
  has:
    field: value
    any:
      - kind: list
      - kind: dictionary
skill_prose: |
  Never default a parameter to a mutable literal (`def f(x=[])`, `def f(x={})`).
  Python evaluates the default once at definition time and reuses that same object,
  so state leaks across calls. Default to `None` and build the container inside the
  body: `def f(x=None):\n    if x is None:\n        x = []`.
examples:
  bad: "def f(x=[]):\n    return x"
  good: "def f(x=None):\n    return x"
---
id: bare-except
language: python
title: "Catch a specific exception instead of a bare `except:`"
why: "A bare `except:` also swallows `KeyboardInterrupt` and `SystemExit`, hiding bugs and breaking Ctrl-C. The right exception type depends on intent, so there is no safe autofix."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern:
    context: "try:\n    pass\nexcept:\n    pass"
    selector: except_clause
skill_prose: |
  Never write a bare `except:`. It catches `BaseException` — including
  `KeyboardInterrupt` and `SystemExit` — so it masks real failures and makes the
  program impossible to interrupt. Catch the narrowest exception you actually handle
  (`except ValueError:`), or `except Exception:` as a deliberate last resort.
examples:
  bad: "try:\n    risky()\nexcept:\n    pass"
  good: "try:\n    risky()\nexcept ValueError:\n    pass"
---
id: type-equality
language: python
title: "Use `isinstance(x, T)` instead of `type(x) == T`"
why: "`type(x) == T` rejects subclasses and reads awkwardly; `isinstance` is the idiom and respects inheritance. The rewrite isn't always behavior-preserving (subclasses), so it's taught."
severity: warn
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "type($X) == $T"
    - pattern: "$T == type($X)"
skill_prose: |
  Prefer `isinstance(x, T)` over `type(x) == T`. `isinstance` is the idiomatic
  type check and accepts subclasses, which is almost always what you want. Reach for
  the exact-type `type(x) is T` comparison only when you deliberately need to exclude
  subclasses.
examples:
  bad: "if type(x) == int:\n    pass"
  good: "if isinstance(x, int):\n    pass"
---
id: assert-tuple
language: python
title: "Don't `assert` a non-empty tuple — it's always true"
why: "`assert (cond, msg)` asserts a 2-tuple, which is always truthy, so the check never fails. The comma is the bug; the fix is to drop the parens, which can't be done blindly."
severity: warn
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "assert ($A, $B)"
    - pattern: "assert ($A, $B, $$$REST)"
skill_prose: |
  `assert (cond, "message")` does not do what it looks like: the parentheses make a
  tuple, and a non-empty tuple is always truthy, so the assertion can never fail.
  Drop the parentheses: `assert cond, "message"`.
examples:
  bad: "assert (x > 0, \"must be positive\")"
  good: "assert x > 0, \"must be positive\""
---
id: is-literal
language: python
title: "Use `==` instead of `is` to compare with a literal"
why: "`is` tests identity, not value; `x is 0` / `x is \"s\"` only works by CPython interning accident and is not guaranteed. Use `==` for value comparison."
severity: warn
fix_policy: warn-and-instruct
rule:
  all:
    - pattern: "$X is $Y"
    - has:
        stopBy: neighbor
        any:
          - kind: integer
          - kind: float
          - kind: string
skill_prose: |
  Never compare against a literal with `is` (`x is 0`, `x is "done"`). `is` checks
  object identity; it appears to work only because CPython caches small ints and some
  strings, which is an implementation detail, not a guarantee. Use `==` for value
  equality and reserve `is` for singletons (`is None`, `is True`).
examples:
  bad: "if x is 0:\n    pass"
  good: "if x == 0:\n    pass"
---
id: not-is
language: python
title: "Use `is not` instead of `not ... is`"
why: "`a is not b` is a single operator that reads as intended; `not a is b` relies on precedence and reads as a negated identity test. No safe autofix: chained comparisons (`not a is b is c`) corrupt under a naive rewrite."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "not $A is $B"
skill_prose: |
  Write `a is not b`, not `not a is b`. Python has a dedicated `is not` operator that
  states the intent directly; the negated form leans on operator precedence and reads
  worse. (This is taught rather than autofixed because chained comparisons like
  `not a is b is c` can't be rewritten mechanically without changing meaning.)
examples:
  bad: "if not a is b:\n    pass"
  good: "if a is not b:\n    pass"
---
id: not-eq
language: python
title: "Use `!=` instead of `not ... ==`"
why: "`a != b` is the inequality operator; `not a == b` negates an equality test and reads awkwardly. No safe autofix: chained comparisons (`not a == b == c`) corrupt under a naive rewrite."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "not $A == $B"
skill_prose: |
  Write `a != b`, not `not a == b`. The `!=` operator says exactly what you mean,
  while the negated equality is noisier and easy to misread. (Taught rather than
  autofixed because chained comparisons like `not a == b == c` can't be rewritten
  mechanically without changing meaning.)
examples:
  bad: "if not a == b:\n    pass"
  good: "if a != b:\n    pass"
---
id: len-zero
language: python
title: "Use truthiness instead of `len(x) == 0`"
why: "Empty containers are falsy, so `not x` is the idiom for emptiness; `len(x) == 0` is more to read and computes a length you don't need. The rewrite isn't always behavior-identical (numpy, len-less iterables), so it's taught."
severity: warn
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "len($X) == 0"
    - pattern: "0 == len($X)"
skill_prose: |
  Test a container for emptiness with its truthiness — `if not items:` /
  `if items:` — rather than `len(items) == 0`. Empty sequences and mappings are
  falsy, so this is shorter and idiomatic. (Stick with explicit `len(...) == 0` when
  the object overrides truthiness in surprising ways, e.g. numpy arrays.)
examples:
  bad: "if len(items) == 0:\n    pass"
  good: "if not items:\n    pass"
---
id: dict-keys-iter
language: python
title: "Iterate a dict directly instead of `.keys()`"
why: "Iterating a dict already yields its keys, so `for k in d.keys()` builds a needless view. `for k in d` is the idiom. Taught rather than autofixed because `.keys()` is sometimes used deliberately (e.g. snapshotting before mutation)."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "for $K in $D.keys():\n    $$$BODY"
skill_prose: |
  Iterate a mapping directly — `for k in d:` — instead of `for k in d.keys()`.
  Iterating a dict already yields its keys, so `.keys()` just adds noise. (Keep
  `list(d.keys())` when you specifically need a snapshot you can mutate the dict
  against during the loop.)
examples:
  bad: "for k in d.keys():\n    print(k)"
  good: "for k in d:\n    print(k)"
---
id: guard-clauses
language: python
title: "Prefer guard clauses over deeply nested conditionals"
why: "Early returns for error/edge cases keep the happy path unindented and readable. Whether a branch should become a guard is a judgment call, so it's taught, not enforced."
severity: info
fix_policy: skill-only
skill_prose: |
  Handle edge cases and errors first with early `return`/`raise`/`continue` so the
  main logic stays at the left margin instead of nesting under a pyramid of `if`s.
  Invert the condition — `if not valid: return` — rather than wrapping the whole
  body in `if valid:`. This is a structural judgment, so it's taught, not enforced.
---
id: comprehension-over-loop
language: python
title: "Prefer a comprehension over a build-up loop"
why: "A list/dict/set comprehension expresses 'transform/filter this iterable' in one expression that's clearer and faster than appending in a loop. Not every loop should become one, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When a loop exists only to build a list/dict/set by repeatedly appending or
  assigning, replace it with a comprehension: `[f(x) for x in xs if pred(x)]`. It's
  one expression, communicates intent, and is faster. Keep the explicit loop when the
  body has side effects, multiple statements, or non-trivial control flow.
---
id: descriptive-names
language: python
title: "Use descriptive names, not single letters"
why: "One-letter names outside tiny scopes force the reader to track what each stands for. Idiomatic short names (`i`, `x`, `k`, `v` in a comprehension) are fine; everything else should describe its role. A judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Name variables for what they hold (`total`, `user`, `retry_count`), not single
  letters. The conventional throwaways — `i`/`j` for indices, `x` in a short
  lambda/comprehension, `k`/`v` when unpacking dict items — are fine in their tiny
  scope; reach for a real name the moment the value outlives a line or two.
---
id: dict-get-default
language: python
title: "Use `dict.get(key, default)` instead of an `in`-check ternary"
why: "`d[k] if k in d else default` looks up `k` twice and is noisier than `d.get(k, default)`. Taught rather than autofixed because `.get` skips a custom `__getitem__`/`__missing__`, so it isn't always equivalent."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "$D[$K] if $K in $D else $DEFAULT"
skill_prose: |
  Replace `value = d[k] if k in d else default` with `value = d.get(k, default)`.
  The ternary hashes/looks up `k` twice and restates `d`; `.get` does it once and
  reads as the intent. (Keep the explicit form when `d` is a `defaultdict` or
  overrides `__getitem__`/`__missing__`, where `.get` would behave differently.)
examples:
  bad: "value = cfg[key] if key in cfg else fallback"
  good: "value = cfg.get(key, fallback)"
---
id: enumerate-over-range-len
language: python
title: "Use `enumerate` instead of `range(len(...))`"
why: "`for i in range(len(xs))` then `xs[i]` re-indexes on every iteration and hides intent; `enumerate(xs)` yields index and item together. No safe autofix — the loop body's `xs[i]` accesses must be rewritten."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "for $I in range(len($XS)):\n    $$$BODY"
skill_prose: |
  Iterate with `for i, item in enumerate(xs):` instead of
  `for i in range(len(xs)):` followed by `xs[i]`. `enumerate` hands you the index
  and the element at once, so the body stops re-indexing. Pass `enumerate(xs, 1)`
  when you want a 1-based counter.
examples:
  bad: "for i in range(len(items)):\n    print(items[i])"
  good: "for i, item in enumerate(items):\n    print(item)"
---
id: f-string-over-format
language: python
title: "Use an f-string instead of `str.format`"
why: "f-strings put the value next to the placeholder, so they're easier to read and faster than `\"...\".format(...)`. Taught rather than autofixed: rewriting positional/named fields back into inline expressions isn't mechanical."
severity: info
fix_policy: warn-and-instruct
rule:
  kind: call
  all:
    - pattern: "$RECV.format($$$ARGS)"
    - has:
        field: function
        has:
          field: object
          kind: string
skill_prose: |
  Prefer f-strings over `"...".format(...)`. `f"Hello {name}"` keeps each value
  inline where it's interpolated, which is clearer and faster than threading
  arguments through `.format`. The same advice applies to `%`-formatting
  (`"%s" % x`), though this rule only flags `.format`. Keep `.format` when the
  template is built dynamically or reused with different arguments.
examples:
  bad: "msg = \"Hello {}\".format(name)"
  good: "msg = f\"Hello {name}\""
---
id: star-import
language: python
title: "Import names explicitly instead of `from x import *`"
why: "A wildcard import dumps unknown names into the namespace, shadows locals silently, and defeats static analysis and dead-code detection. Name what you use."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "from $MODULE import *"
skill_prose: |
  Never use `from module import *`. It pulls an unknown set of names into the
  current namespace — which can shadow your own bindings without warning — and makes
  it impossible for readers and tools to see where a name came from. Import exactly
  what you use: `from module import thing, other`.
examples:
  bad: "from os import *"
  good: "from os import getcwd"
---
id: redundant-lambda
language: python
title: "Pass the function directly instead of wrapping it in a lambda"
why: "`lambda x: f(x)` is just `f` with extra indirection. Taught rather than autofixed: the unwrap is only safe when the wrapped callable doesn't close over the parameter (e.g. `lambda x: x.method(x)` would leak `x`)."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "lambda $X: $F($X)"
skill_prose: |
  When a lambda only forwards its argument to a call — `lambda x: f(x)` — pass the
  callable itself: `f`. The wrapper adds a stack frame and noise for no behavior.
  (Don't unwrap when the callee references the parameter, like `lambda x: x.run(x)`,
  or when the lambda fixes extra arguments, like `lambda x: f(x, mode=1)`.)
examples:
  bad: "handler = lambda x: process(x)"
  good: "handler = process"
---
id: compare-true-false
language: python
title: "Test truthiness instead of `== True` / `== False`"
why: "`if x == True:` is redundant and subtly wrong — `2 == True` is `False` even though `2` is truthy. No safe autofix: `x == True` is not equivalent to `x` for non-bool values."
severity: warn
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$X == True"
    - pattern: "$X == False"
    - pattern: "True == $X"
    - pattern: "False == $X"
skill_prose: |
  Don't compare to the boolean literals. Write `if x:` and `if not x:` rather than
  `if x == True:` / `if x == False:`. The explicit comparison is noise, and it's
  outright wrong for non-bool truthy values — `2 == True` is `False` while `if 2:`
  is taken. When you truly must accept only the singleton `True`, say `x is True`.
examples:
  bad: "if flag == True:\n    pass"
  good: "if flag:\n    pass"
---
id: isinstance-tuple
language: python
title: "Pass a tuple to `isinstance` instead of chaining `or`"
why: "`isinstance(x, A) or isinstance(x, B)` repeats the subject and the call; `isinstance(x, (A, B))` checks all types in one pass and reads better. Taught rather than autofixed because longer `or` chains and surrounding boolean context vary."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "isinstance($X, $A) or isinstance($X, $B)"
skill_prose: |
  Collapse `isinstance(x, A) or isinstance(x, B)` into `isinstance(x, (A, B))`.
  `isinstance` accepts a tuple of types and returns true if `x` matches any of them,
  so you check once instead of repeating the subject. Extend the tuple for more
  types: `isinstance(x, (int, float, complex))`.
examples:
  bad: "if isinstance(x, int) or isinstance(x, float):\n    pass"
  good: "if isinstance(x, (int, float)):\n    pass"
---
id: open-without-context
language: python
title: "Open files with a `with` block, not a bare `open()`"
why: "Binding `f = open(...)` leaks the handle if an exception fires before `close()`. A `with` block closes it deterministically. No safe autofix — the matching `close()` and the block scope must be restructured."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "$VAR = open($$$ARGS)"
skill_prose: |
  Open files in a `with` block — `with open(path) as f:` — instead of binding the
  handle to a variable. The context manager closes the file even if the body raises,
  whereas a bare `f = open(...)` leaks the descriptor on any early exit. (While here,
  pass an explicit `encoding=` so text mode doesn't depend on the platform default.)
examples:
  bad: "f = open(\"data.txt\")"
  good: "with open(\"data.txt\") as f:\n    pass"
---
id: unnecessary-comprehension
language: python
title: "Use `list(iterable)` instead of an identity comprehension"
why: "`[x for x in xs]` copies the iterable while applying no transform or filter — `list(xs)` does the same thing, faster and clearer."
severity: info
fix_policy: autofix
rule:
  pattern: "[$X for $X in $IT]"
fix: "list($IT)"
skill_prose: |
  When a list comprehension has no transform and no condition — `[x for x in xs]` —
  it's just an eager copy, so write `list(xs)`. (The same goes for `{x for x in xs}`
  → `set(xs)`.) Keep the comprehension as soon as there's a real expression
  (`[f(x) for x in xs]`) or a filter (`[x for x in xs if pred(x)]`).
examples:
  bad: "ys = [x for x in xs]"
  good: "ys = list(xs)"
---
id: chained-comparison
language: python
title: "Chain comparisons instead of joining them with `and`"
why: "`a < b and b < c` repeats `b` and reads as two checks; Python's `a < b < c` chains them in one expression that evaluates `b` once."
severity: info
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$A < $B and $B < $C"
    - pattern: "$A <= $B and $B <= $C"
    - pattern: "$A > $B and $B > $C"
    - pattern: "$A >= $B and $B >= $C"
skill_prose: |
  Use Python's comparison chaining — `if low <= x <= high:` — instead of
  `low <= x and x <= high`. The chained form names the middle operand once, evaluates
  it once, and reads like the mathematical range it represents.
examples:
  bad: "if a < b and b < c:\n    pass"
  good: "if a < b < c:\n    pass"
---
id: string-startswith-tuple
language: python
title: "Pass a tuple to `startswith`/`endswith` instead of chaining `or`"
why: "`s.startswith(a) or s.startswith(b)` repeats the subject and call; `startswith` accepts a tuple of prefixes and tests them all in one call."
severity: info
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$S.startswith($A) or $S.startswith($B)"
    - pattern: "$S.endswith($A) or $S.endswith($B)"
skill_prose: |
  `str.startswith` and `str.endswith` accept a tuple, so collapse
  `name.startswith(\"a\") or name.startswith(\"b\")` into
  `name.startswith((\"a\", \"b\"))`. One call, no repeated subject, and it extends to
  any number of prefixes.
examples:
  bad: "if name.startswith(\"test_\") or name.startswith(\"Test\"):\n    pass"
  good: "if name.startswith((\"test_\", \"Test\")):\n    pass"
---
id: nested-ternary
language: python
title: "Avoid nested conditional expressions"
why: "A conditional expression nested inside another (`a if p else (b if q else c)`) is hard to parse at a glance. Whether to unfold it into `if`/`elif` is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Don't nest conditional expressions — `a if p else b if q else c` forces the reader
  to untangle precedence and branches in one line. Pull it apart into an `if`/`elif`/
  `else` block, a lookup table/`dict`, or a small helper with early returns. A single
  `x if cond else y` is fine; the moment you nest, prefer statements.
---
id: type-annotations
language: python
title: "Annotate function signatures with type hints"
why: "Type hints on parameters and return values document intent, enable static checkers (mypy/pyright) and editor tooling, and catch whole classes of bugs. Where annotations add value is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Give public functions and methods type hints — `def parse(raw: str) -> Config:` —
  so callers, type checkers, and editors know the contract. Annotate parameters and
  the return type; reach for `typing`/`collections.abc` (`Sequence`, `Mapping`,
  `Optional`, `Iterable`) for containers. Local throwaway scripts can stay loose, but
  anything reused or shared benefits from explicit types.
