name: typescript-core
language: typescript
version: 0.1.0
---
id: triple-equals
language: typescript
title: "Use `===` instead of `==`"
why: "`==` does type coercion with surprising rules; `===` compares without coercion and is the TS/JS idiom."
severity: warn
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$A == $B"
    - pattern: "$A != $B"
skill_prose: |
  Always compare with `===` / `!==`, never `==` / `!=`. Loose equality coerces
  operands with rules almost nobody remembers; strict equality says exactly what
  you mean. (The one classic exception — `x == null` to catch both `null` and
  `undefined` — is better written explicitly.)
examples:
  bad: "if (a == b) {\n  return;\n}"
  good: "if (a === b) {\n  return;\n}"
---
id: optional-chaining
language: typescript
title: "Use optional chaining instead of `a && a.b`"
why: "`a?.b` is shorter, communicates intent, and avoids the truthiness pitfalls of `&&` guards."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "$A && $A.$B"
examples:
  bad: "const name = user && user.name;"
  good: "const name = user?.name;"
---
id: no-console
language: typescript
title: "Use a logger instead of `console.log` for diagnostics"
why: "console.log can't be leveled, filtered, or routed and tends to ship to production. There is no single safe rewrite."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "console.log($$$ARGS)"
skill_prose: |
  Reach for a real logger (pino, winston, or your app's logging module) instead of
  `console.log` for anything diagnostic, so output can be leveled and routed and
  doesn't leak to production stdout.
examples:
  bad: "console.log(\"value\", value);"
  good: "logger.debug(\"value\", value);"
---
id: arrow-implicit-return
language: typescript
title: "Use an implicit arrow return instead of a block with a single return"
why: "A single-expression arrow body is cleaner and identical in behavior."
severity: info
fix_policy: autofix
rule:
  all:
    - pattern: "($PARAMS) => { return $EXPR; }"
    - not:
        pattern: "($PARAMS) => { return {$$$_}; }"
fix: "($PARAMS) => $EXPR"
examples:
  bad: "const f = (x) => { return x + 1; };"
  good: "const f = (x) => x + 1;"
---
id: prefer-named-exports
language: typescript
title: "Prefer named exports over a default export"
why: "Named exports give every consumer the same name, enable safe renames and tree-shaking, and avoid default-export refactor friction. Judgment call, no detector."
severity: info
fix_policy: skill-only
skill_prose: |
  Prefer named exports (`export const x`, `export function f`) over `export
  default`. Named exports keep one canonical name across the codebase, make
  rename-symbol and auto-import reliable, and avoid the default-export quirks with
  re-exports and tree-shaking. This is a design judgment, so it's taught, not
  enforced.
---
id: no-var
language: typescript
title: "Use `let`/`const` instead of `var`"
why: "`var` is function-scoped and hoisted, which causes leaking and TDZ-free surprises; `let`/`const` are block-scoped. The right choice (`let` vs `const`) depends on reassignment, so it's taught, not autofixed."
severity: warn
fix_policy: warn-and-instruct
rule:
  kind: variable_declaration
skill_prose: |
  Never declare with `var`. It's function-scoped and hoisted, so it leaks out of
  blocks and enables whole classes of bugs. Use `const` by default and `let` only
  when you actually reassign — both are block-scoped and say more about intent.
examples:
  bad: "var x = 1;"
  good: "const x = 1;"
---
id: no-eval
language: typescript
title: "Never use `eval`"
why: "`eval` executes arbitrary strings as code — an injection and performance hazard that also defeats minifiers and static analysis. There is no mechanical replacement; the data flow must be redesigned."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "eval($$$ARGS)"
skill_prose: |
  Do not use `eval`. Running a string as code is a remote-code-execution risk the
  moment any part of that string is influenced by input, and it blocks minification
  and optimization. Parse data with `JSON.parse`, dispatch on a lookup table/`Map`,
  or restructure so no dynamic code is needed.
examples:
  bad: "const data = eval(input);"
  good: "const data = JSON.parse(input);"
---
id: no-debugger
language: typescript
title: "Remove stray `debugger` statements"
why: "A committed `debugger` halts execution whenever devtools are open — it's debugging scaffolding that should never reach shared branches or production."
severity: warn
fix_policy: warn-and-instruct
rule:
  kind: debugger_statement
skill_prose: |
  Strip `debugger` statements before committing. They pause execution whenever a
  developer has devtools open, which is disruptive in shared and production builds.
  Use breakpoints in your editor/devtools instead of hard-coding them in source.
examples:
  bad: "debugger;"
  good: "noop();"
---
id: no-array-constructor
language: typescript
title: "Use an array literal instead of `new Array()`"
why: "`new Array()` is verbose and footgun-adjacent (`new Array(3)` makes a length-3 hole array, not `[3]`). The empty form is unambiguously `[]`."
severity: warn
fix_policy: autofix
rule:
  pattern: "new Array()"
fix: "[]"
skill_prose: |
  Prefer the array literal `[]` over `new Array()`. The constructor is longer and its
  single-number form is a trap — `new Array(3)` is a length-3 empty array, not `[3]`.
  (Only the zero-argument form is autofixed; argument forms are left for you to decide.)
examples:
  bad: "const a = new Array();"
  good: "const a = [];"
---
id: prefer-includes
language: typescript
title: "Use `.includes()` instead of `.indexOf(x) !== -1`"
why: "`.includes(x)` states the membership test directly; `.indexOf(x) !== -1` is an idiom from before `includes` existed and is easy to get wrong (`> -1` vs `>= 0`). The one divergence — `includes` finds `NaN`, `indexOf` never does — only affects a test that was already always-false, so correct code is unchanged."
severity: warn
fix_policy: autofix
rule:
  pattern: "$A.indexOf($X) !== -1"
fix: "$A.includes($X)"
skill_prose: |
  Test membership with `arr.includes(x)` rather than `arr.indexOf(x) !== -1`. It
  reads as the boolean it is and avoids the off-by-one traps of comparing an index.
  (Only the `!== -1` form is autofixed; `=== -1` and `>= 0` variants are left alone.)
  One edge: `includes` uses SameValueZero, so it matches `NaN` where `indexOf` —
  which uses strict `===` — never does. That only changes the result of an
  `indexOf(NaN) !== -1` test that was already permanently false, so working code is
  unaffected; reach for a custom `.some(Number.isNaN)` if you genuinely test for `NaN`.
examples:
  bad: "const has = arr.indexOf(x) !== -1;"
  good: "const has = arr.includes(x);"
---
id: avoid-any
language: typescript
title: "Avoid `any`; prefer `unknown` or a specific type"
why: "`any` opts out of type checking entirely and silently propagates, defeating the purpose of TypeScript. `unknown` keeps safety while staying generic; the right concrete type depends on context, so it's taught."
severity: warn
fix_policy: warn-and-instruct
rule:
  kind: predefined_type
  regex: "^any$"
skill_prose: |
  Avoid `any`. It disables type checking on the value and everything derived from it,
  which quietly erodes safety across the codebase. Use `unknown` when the type is
  genuinely open (it forces a narrowing check before use), or write the specific
  type/`interface`/generic that describes the value.
examples:
  bad: "let value: any;"
  good: "let value: unknown;"
---
id: no-non-null-assertion
language: typescript
title: "Avoid the non-null assertion `!`"
why: "`x!` asserts a value isn't null/undefined without proof; if you're wrong it throws at runtime, defeating the type checker. The safe fix (guard, default, narrowing) depends on context."
severity: warn
fix_policy: warn-and-instruct
rule:
  kind: non_null_expression
skill_prose: |
  Avoid the non-null assertion operator (`x!`). It silences the compiler rather than
  proving the value is present, so a wrong assumption becomes a runtime crash. Narrow
  with an explicit check (`if (x) ...`), provide a default (`x ?? fallback`), or fix
  the type so it isn't nullable in the first place.
examples:
  bad: "const len = name!.length;"
  good: "const len = name?.length ?? 0;"
---
id: prefer-spread-array
language: typescript
title: "Use array spread instead of `[].concat(...)`"
why: "`[...a, ...b]` is the modern, readable way to merge arrays; `[].concat(a, b)` is the pre-ES2015 idiom and obscures intent. Taught rather than autofixed because `concat` has spread-incompatible behavior with non-array args."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "[].concat($$$ARGS)"
skill_prose: |
  Merge arrays with spread — `[...a, ...b]` — instead of `[].concat(a, b)`. Spread is
  the current idiom and reads as construction rather than a method chain. (Note
  `concat` flattens one level of array arguments but appends non-array values, so a
  blind rewrite isn't always equivalent — convert deliberately.)
examples:
  bad: "const all = [].concat(a, b);"
  good: "const all = [...a, ...b];"
---
id: prefer-early-return
language: typescript
title: "Prefer early returns over deeply nested conditionals"
why: "Returning early on guard conditions keeps the happy path unindented. Whether a branch should flip into a guard is a judgment call, so it's taught, not enforced."
severity: info
fix_policy: skill-only
skill_prose: |
  Handle edge cases and errors up front with early `return`/`throw`/`continue` so the
  primary logic stays at the left margin instead of nesting inside `if` blocks. Invert
  the condition — `if (!ok) return;` — rather than wrapping the body in `if (ok)`.
  This is a structural judgment, so it's taught, not enforced.
---
id: boolean-naming
language: typescript
title: "Name booleans with an `is`/`has`/`should` prefix"
why: "A boolean named `active` reads ambiguously at the call site; `isActive` makes the type and meaning obvious. A naming judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Give boolean variables, parameters, and properties a predicate prefix — `isActive`,
  `hasPermission`, `shouldRetry`, `canEdit`. It makes call sites read like assertions
  (`if (isActive)`) and signals the type at a glance. Reserve bare nouns for values
  that aren't booleans.
---
id: cohesive-modules
language: typescript
title: "Keep each module focused on one responsibility"
why: "A module that mixes unrelated concerns is hard to name, test, and tree-shake. Where the boundaries lie is a design judgment, so it's taught, not enforced."
severity: info
fix_policy: skill-only
skill_prose: |
  Keep a module cohesive: one clear responsibility, exports that belong together, a
  name that describes the whole. When a file accumulates unrelated helpers, types, and
  side effects, split it along the seams so each module can be understood, tested, and
  tree-shaken on its own. This is an architectural judgment, so it's taught.
---
id: prefer-object-shorthand
language: typescript
title: "Use object property shorthand (`{ x }` not `{ x: x }`)"
why: "When a property name matches the variable it's assigned from, shorthand is shorter and idiomatic with identical behavior."
severity: info
fix_policy: autofix
rule:
  kind: pair
  all:
    - has:
        field: key
        pattern: "$K"
    - has:
        field: value
        pattern: "$K"
fix: "$K"
skill_prose: |
  Use shorthand when a property's name equals the variable supplying it: write
  `{ x, y }` instead of `{ x: x, y: y }`. It's identical in behavior and the standard
  style. (Only bare `name: name` pairs are rewritten — computed keys, method values,
  and `name: expr` are left alone.)
examples:
  bad: "const o = { x: x };"
  good: "const o = { x };"
---
id: prefer-template
language: typescript
title: "Use a template literal instead of string concatenation"
why: "`` `Hello ${name}` `` reads in order and avoids quote-and-plus juggling; `\"Hello \" + name` is noisier and error-prone. Taught rather than autofixed because turning each operand into a `${}` placeholder isn't a mechanical splice."
severity: info
fix_policy: warn-and-instruct
rule:
  all:
    - pattern: "$A + $B"
    - has:
        stopBy: neighbor
        kind: string
skill_prose: |
  Build strings with template literals — `` `Hello ${name}, you have ${count} new` ``
  — instead of `"Hello " + name + ", you have " + count + " new"`. The template reads
  left to right with the values inline, and you stop juggling quotes and `+`. Plain
  concatenation of two non-string values isn't affected.
examples:
  bad: "const m = \"Hello \" + name;"
  good: "const m = `Hello ${name}`;"
---
id: no-throw-literal
language: typescript
title: "Throw an `Error`, not a string or number literal"
why: "Throwing a literal loses the stack trace and the `.message`/`.name` contract every catch site and logger relies on. Taught rather than autofixed because the right Error subtype and message are a judgment call."
severity: warn
fix_policy: warn-and-instruct
rule:
  kind: throw_statement
  has:
    stopBy: neighbor
    any:
      - kind: string
      - kind: number
skill_prose: |
  Always throw an `Error` (or a subclass), never a bare string or number:
  `throw new Error("boom")`, not `throw "boom"`. Only `Error` objects carry a stack
  trace and the `name`/`message` properties that catch blocks, loggers, and error
  reporters expect. Define a custom `class XError extends Error` when callers need to
  branch on the failure type.
examples:
  bad: "throw \"boom\";"
  good: "throw new Error(\"boom\");"
---
id: prefer-optional-catch-binding
language: typescript
title: "Omit the catch binding when it's unused"
why: "An empty `catch (e) {}` binds an error it never uses; `catch {}` says that directly. The empty body proves the binding is unused, so the rewrite is safe."
severity: info
fix_policy: autofix
rule:
  pattern:
    context: "try {} catch ($E) {}"
    selector: catch_clause
fix: "catch {}"
skill_prose: |
  When a catch block doesn't use the error, drop the binding: `catch {}` instead of
  `catch (e) {}` (the optional catch binding, ES2019). It states that the error is
  intentionally ignored. (Note an empty catch is often itself a smell — make sure you
  really mean to swallow the error rather than log or rethrow it.)
examples:
  bad: "try { f(); } catch (e) {}"
  good: "try { f(); } catch {}"
---
id: prefer-for-of
language: typescript
title: "Use `for...of` instead of a C-style index loop over an array"
why: "`for (const x of xs)` iterates values directly; the `for (let i = 0; i < xs.length; i++)` form exists to compute indices you usually don't need. Whether the index is actually needed is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Iterate arrays with `for (const item of items)` rather than
  `for (let i = 0; i < items.length; i++)` followed by `items[i]`. The `for...of`
  form names the element and drops the index bookkeeping. When you genuinely need the
  index too, reach for `items.forEach((item, i) => ...)` or `for (const [i, item] of
  items.entries())` instead of falling back to the manual counter.
---
id: prefer-string-startswith
language: typescript
title: "Use `.startsWith()` instead of `.indexOf(x) === 0`"
why: "`s.startsWith(x)` states the intent; `s.indexOf(x) === 0` is the pre-ES2015 idiom and scans for a position you then compare. Taught rather than autofixed: `Array.indexOf` matches the same shape but arrays have no `.startsWith`, and ast-grep can't tell a string receiver from an array, so a blind rewrite would crash array code at runtime."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "$S.indexOf($X) === 0"
skill_prose: |
  When the receiver is a string, test a prefix with `s.startsWith(x)` instead of
  `s.indexOf(x) === 0` — it reads as the boolean it is and doesn't compute an index
  you immediately compare away. Use `s.endsWith(x)` for suffixes. (Don't apply this to
  an array: `arr.indexOf(x) === 0` means "x is the first element" and arrays have no
  `.startsWith` — use `arr[0] === x` there.)
examples:
  bad: "const ok = s.indexOf(\"a\") === 0;"
  good: "const ok = s.startsWith(\"a\");"
---
id: prefer-exponent
language: typescript
title: "Use the `**` operator instead of `Math.pow`"
why: "`a ** b` is the built-in exponentiation operator — shorter and clearer than `Math.pow(a, b)`. Taught rather than autofixed: a naive rewrite drops precedence parens (`Math.pow(a+1, b)` → `a+1 ** b`) and `Math.pow(-2, 2)` → `-2 ** 2` is a syntax error."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "Math.pow($A, $B)"
skill_prose: |
  Use the exponentiation operator: `a ** b` instead of `Math.pow(a, b)`. It's the
  native operator and reads cleanly. When the base or exponent is a compound
  expression, parenthesize — `(a + 1) ** b` — and note a negative literal base needs
  parens too: `(-2) ** 2`, since `-2 ** 2` is a syntax error.
examples:
  bad: "const y = Math.pow(x, 2);"
  good: "const y = x ** 2;"
---
id: prefer-number-isnan
language: typescript
title: "Use `Number.isNaN` instead of the global `isNaN`"
why: "The global `isNaN` coerces its argument first, so `isNaN(\"foo\")` is `true` — a frequent source of bugs. `Number.isNaN` checks for the actual NaN value. No safe autofix: the two are not equivalent for non-number arguments."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "isNaN($X)"
skill_prose: |
  Use `Number.isNaN(x)`, not the global `isNaN(x)`. The global coerces first, so
  `isNaN("foo")` and `isNaN(undefined)` are `true` even though neither is the NaN
  value — a classic footgun. `Number.isNaN` returns true only for actual `NaN`. If you
  do want the coercing check, make it explicit with `Number.isNaN(Number(x))`.
examples:
  bad: "if (isNaN(n)) {}"
  good: "if (Number.isNaN(n)) {}"
---
id: prefer-at
language: typescript
title: "Use `.at(-1)` instead of `arr[arr.length - 1]`"
why: "`arr.at(-1)` reads as 'last element' and names `arr` once; `arr[arr.length - 1]` restates the array and does index arithmetic. Taught rather than autofixed because `.at` differs subtly on exotic indexables (strings, typed arrays) and the index expression can have side effects."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "$A[$A.length - 1]"
skill_prose: |
  Index from the end with `arr.at(-1)` instead of `arr[arr.length - 1]`. `.at` takes
  negative indices, so it reads as 'the last element' and mentions the array once
  rather than twice. (`.at` is ES2022 — fine for modern runtimes; reach for the
  classic form only when targeting environments without it.)
examples:
  bad: "const last = items[items.length - 1];"
  good: "const last = items.at(-1);"
---
id: prefer-nullish-coalescing
language: typescript
title: "Use `??` instead of `||` for defaults"
why: "`a || b` falls through on every falsy value, so `0`, `\"\"`, and `false` get replaced by the default; `a ?? b` only does so for `null`/`undefined`. Which you want is a semantic judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When supplying a default for a possibly-missing value, prefer `a ?? b` over
  `a || b`. `||` treats every falsy value — `0`, `""`, `false`, `NaN` — as absent, so
  `count || 10` turns a real `0` into `10`. `??` substitutes only for `null`/
  `undefined`, which is almost always what 'use the default when unset' means. Keep
  `||` when you genuinely want any falsy value to trigger the fallback.
---
id: no-nested-ternary
language: typescript
title: "Avoid nested ternary expressions"
why: "A ternary inside another (`a ? b : c ? d : e`) is hard to read and easy to mis-bracket. Whether to unfold it is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Don't nest ternaries — `cond1 ? a : cond2 ? b : c` packs branching logic into one
  hard-to-scan line. Unfold it into early returns, an `if`/`else if` chain, or a
  lookup map. A single `cond ? a : b` is fine; once you'd nest a second `?:`, switch
  to statements.
---
id: no-object-constructor
language: typescript
title: "Use an object literal instead of `new Object()`"
why: "`new Object()` is verbose and offers nothing over `{}`; the literal is the universal idiom."
severity: warn
fix_policy: autofix
rule:
  pattern: "new Object()"
fix: "{}"
skill_prose: |
  Prefer the object literal `{}` over `new Object()`. The constructor is longer and
  buys nothing. (Only the zero-argument form is autofixed.)
examples:
  bad: "const o = new Object();"
  good: "const o = {};"
---
id: no-unneeded-ternary
language: typescript
title: "Use `Boolean(x)` instead of `x ? true : false`"
why: "`cond ? true : false` is a verbose way to coerce to boolean; `Boolean(cond)` says it directly and is exactly equivalent."
severity: info
fix_policy: autofix
rule:
  pattern: "$X ? true : false"
fix: "Boolean($X)"
skill_prose: |
  A ternary whose branches are `true` and `false` is just a boolean coercion —
  write `Boolean(cond)` instead of `cond ? true : false`. If `cond` is already a
  boolean you can often drop the wrapper entirely.
examples:
  bad: "const b = cond ? true : false;"
  good: "const b = Boolean(cond);"
---
id: no-self-compare
language: typescript
title: "Don't compare a value to itself"
why: "`x === x` is always true (and `x !== x` always false) except for `NaN`; if you mean the NaN check, say `Number.isNaN(x)`. Otherwise it's a bug or dead code."
severity: warn
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$X === $X"
    - pattern: "$X !== $X"
skill_prose: |
  Comparing a value to itself with `===`/`!==` is a no-op for everything except
  `NaN`. If you're checking for `NaN`, use `Number.isNaN(x)` — it states the intent.
  Otherwise the duplicated operand is almost always a typo for a different variable.
examples:
  bad: "if (x === x) {\n  return;\n}"
  good: "if (Number.isNaN(x)) {\n  return;\n}"
---
id: no-nan-equality
language: typescript
title: "Use `Number.isNaN(x)` instead of comparing to `NaN`"
why: "`NaN` is never equal to anything, including itself, so `x === NaN` is always false. Only `Number.isNaN(x)` actually detects it."
severity: warn
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$X === NaN"
    - pattern: "$X !== NaN"
    - pattern: "NaN === $X"
    - pattern: "NaN !== $X"
skill_prose: |
  Never compare against `NaN` with `===`/`!==`: by IEEE-754 `NaN` is unequal to
  everything, so `x === NaN` is permanently false. Detect it with `Number.isNaN(x)`.
examples:
  bad: "if (x === NaN) {\n  return;\n}"
  good: "if (Number.isNaN(x)) {\n  return;\n}"
---
id: prefer-array-some
language: typescript
title: "Use `.some()` instead of `.filter(...).length > 0`"
why: "`arr.some(pred)` answers the existence question directly and short-circuits; `.filter(pred).length > 0` builds a throwaway array and scans the whole input. Taught rather than autofixed because `filter` runs the predicate on every element while `some` stops early, so a side-effecting predicate changes behavior."
severity: info
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$A.filter($F).length > 0"
    - pattern: "$A.filter($F).length !== 0"
skill_prose: |
  To ask whether any element matches, use `arr.some(pred)` rather than
  `arr.filter(pred).length > 0`. `some` short-circuits on the first hit and allocates
  nothing. (Mind a predicate with side effects: `filter` calls it on every element,
  `some` stops at the first match.)
examples:
  bad: "const has = items.filter(f).length > 0;"
  good: "const has = items.some(f);"
---
id: prefer-array-find
language: typescript
title: "Use `.find()` instead of `.filter(...)[0]`"
why: "`arr.find(pred)` returns the first match and stops; `arr.filter(pred)[0]` builds the full matching array just to take its head. Taught rather than autofixed because `filter` evaluates the predicate on every element."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "$A.filter($F)[0]"
skill_prose: |
  To get the first matching element, use `arr.find(pred)` instead of
  `arr.filter(pred)[0]`. `find` short-circuits and returns `undefined` when nothing
  matches, identical to indexing an empty array — but without building it.
examples:
  bad: "const first = items.filter(f)[0];"
  good: "const first = items.find(f);"
---
id: prefer-flatmap
language: typescript
title: "Use `.flatMap()` instead of `.map(...).flat()`"
why: "`arr.flatMap(f)` maps and flattens one level in a single pass; `.map(f).flat()` allocates an intermediate array. They're equivalent for one level of flattening."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "$A.map($F).flat()"
skill_prose: |
  When you map and then flatten one level, use `arr.flatMap(f)` instead of
  `arr.map(f).flat()`. It's one pass with no intermediate array. (`flatMap` only
  flattens a single level; keep `.flat(depth)` when you need deeper flattening.)
examples:
  bad: "const r = items.map(f).flat();"
  good: "const r = items.flatMap(f);"
---
id: prefer-array-isarray
language: typescript
title: "Use `Array.isArray(x)` instead of `x instanceof Array`"
why: "`instanceof Array` returns false for arrays created in another realm (iframe, worker, vm); `Array.isArray` works across realms and is the canonical check."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "$X instanceof Array"
skill_prose: |
  Detect arrays with `Array.isArray(x)`, not `x instanceof Array`. `instanceof`
  checks the prototype chain against *this* realm's `Array`, so it misreports arrays
  passed from an iframe, worker, or `vm` context. `Array.isArray` has no such blind spot.
examples:
  bad: "if (x instanceof Array) {\n  return;\n}"
  good: "if (Array.isArray(x)) {\n  return;\n}"
---
id: prefer-spread-over-apply
language: typescript
title: "Use spread instead of `fn.apply(null, args)`"
why: "`fn(...args)` is the modern way to call a function with an array of arguments; `fn.apply(null, args)` is the pre-ES2015 idiom and obscures the call. Taught rather than autofixed because `apply` also rebinds `this`, so the rewrite is only equivalent when the thisArg is `null`/`undefined`."
severity: info
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$F.apply(null, $ARGS)"
    - pattern: "$F.apply(undefined, $ARGS)"
skill_prose: |
  Spread an argument array into a call — `fn(...args)` — instead of
  `fn.apply(null, args)`. Spread reads as a normal call and composes with other
  arguments. (When `apply`'s first argument is a real object it's rebinding `this`;
  use `fn.call`/`Reflect.apply` deliberately there rather than spread.)
examples:
  bad: "const r = fn.apply(null, args);"
  good: "const r = fn(...args);"
---
id: prefer-optional-call
language: typescript
title: "Use optional chaining for guarded method calls"
why: "`obj?.run()` is shorter and clearer than `obj && obj.run()`, and avoids the truthiness pitfalls of an `&&` guard."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "$A && $A.$M()"
skill_prose: |
  Guard a method call with optional chaining — `obj?.run()` — instead of
  `obj && obj.run()`. It expresses 'call only if present' directly and skips the
  call (yielding `undefined`) when `obj` is nullish, without treating `0`/`""` as absent.
examples:
  bad: "const r = obj && obj.run();"
  good: "const r = obj?.run();"
---
id: prefer-object-spread
language: typescript
title: "Use object spread instead of `Object.assign({}, ...)`"
why: "`{ ...a, ...b }` builds a new merged object as a literal; `Object.assign({}, a, b)` does the same thing with more ceremony. Taught rather than autofixed because `Object.assign` triggers setters on the target whereas spread defines own properties — a difference that matters only in rare cases."
severity: info
fix_policy: warn-and-instruct
rule:
  pattern: "Object.assign({}, $$$SRC)"
skill_prose: |
  Merge into a fresh object with spread — `{ ...a, ...b }` — instead of
  `Object.assign({}, a, b)`. The literal reads as construction and is the common
  idiom. (Keep `Object.assign(target, ...)` when you intend to mutate an existing
  object in place rather than create a new one.)
examples:
  bad: "const merged = Object.assign({}, a, b);"
  good: "const merged = { ...a, ...b };"
---
id: prefer-logical-assignment
language: typescript
title: "Use logical assignment (`||=`, `??=`, `&&=`)"
why: "`a ||= b` / `a ??= b` / `a &&= b` say 'assign conditionally' in one operator; `a = a || b` restates the target. Taught rather than autofixed because the compound form short-circuits the assignment (skipping setters) where the expanded form always assigns."
severity: info
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "$A = $A || $B"
    - pattern: "$A = $A ?? $B"
    - pattern: "$A = $A && $B"
skill_prose: |
  Collapse `a = a || b` into `a ||= b`, `a = a ?? b` into `a ??= b`, and
  `a = a && b` into `a &&= b` (ES2021 logical assignment). Prefer `??=` over `||=`
  for defaults so a real `0`/`""`/`false` isn't overwritten.
examples:
  bad: "x = x || 5;"
  good: "x ||= 5;"
---
id: prefer-destructuring
language: typescript
title: "Destructure objects and arrays instead of repeated member access"
why: "Pulling several fields out with `const { a, b, c } = obj` is shorter and names the bindings once, versus `const a = obj.a; const b = obj.b;`. Whether destructuring improves a given spot is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When you read several properties off the same object (or several elements off an
  array), destructure: `const { id, name, role } = user;` instead of three
  `user.x` reads. It names the bindings once and signals exactly which fields you
  depend on. Skip it when you only touch one property or want to keep the receiver visible.
---
id: prefer-numeric-separators
language: typescript
title: "Use numeric separators in large number literals"
why: "`1_000_000` is far easier to read at a glance than `1000000`; the underscores are ignored by the parser. A readability judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Group digits in large numeric literals with `_` separators — `1_000_000`,
  `0xFF_EC_DE`, `1_000.50` — so magnitude is readable without counting zeros. The
  separators are purely cosmetic and don't change the value. Reserve them for
  numbers big enough that grouping helps.
---
id: prefer-object-entries
language: typescript
title: "Iterate with `Object.entries` instead of keys-then-index"
why: "`for (const [k, v] of Object.entries(obj))` yields key and value together; `Object.keys(obj)` followed by `obj[k]` re-indexes on every iteration. Whether you need both is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When you need both key and value, iterate `Object.entries(obj)` and destructure
  `[key, value]`, rather than looping `Object.keys(obj)` and re-reading `obj[key]`.
  Use `Object.values(obj)` when you only want values and `Object.keys(obj)` when you
  only want keys.
---
id: prefer-set-for-membership
language: typescript
title: "Use a `Set` for repeated membership tests"
why: "Checking `array.includes(x)` inside a loop is O(n) each time, making the whole thing O(n·m); a `Set` lookup is O(1). When and whether to switch is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When you test membership against the same collection many times — especially in a
  loop — build a `Set` once and use `set.has(x)` (O(1)) instead of `array.includes(x)`
  (O(n)). For a handful of checks against a short array, `includes` is fine and reads
  more simply.
---
id: prefer-map-over-record
language: typescript
title: "Use a `Map` instead of a plain object for a dynamic dictionary"
why: "A plain object as a keyed store inherits prototype keys (`__proto__`, `toString`), only allows string/symbol keys, and has no clean size/iteration API. `Map` avoids all of this. A design judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When keys are dynamic, arbitrary, or non-string, reach for `Map` rather than a
  plain `{}`. `Map` has any-type keys, ordered iteration, a real `.size`, and no
  prototype-pollution surprises (`obj["__proto__"]`). Keep plain objects for fixed,
  known-at-author-time shapes that you'll also type with an interface.
---
id: no-for-in-array
language: typescript
title: "Don't iterate arrays with `for...in`"
why: "`for...in` enumerates string keys including inherited and non-index properties, in no guaranteed order — almost never what you want for an array. Use `for...of` or array methods. A judgment call about the right replacement, so it's taught."
severity: warn
fix_policy: skill-only
skill_prose: |
  Never loop an array with `for (const i in arr)`: it yields *string* keys, walks
  inherited enumerable properties, and isn't index-ordered by spec. Use
  `for (const item of arr)` for values, `arr.entries()` when you need the index, or
  `arr.forEach`. Reserve `for...in` for plain objects (with a `hasOwnProperty` guard).
---
id: prefer-not-includes
language: typescript
title: "Use `!arr.includes(x)` instead of `.indexOf(x) === -1`"
why: "`!arr.includes(x)` states the absence test directly; `.indexOf(x) === -1` is the pre-ES2015 idiom and is easy to get wrong. The only divergence — `includes` finds `NaN` — affects a test that was already always-false, so correct code is unchanged."
severity: warn
fix_policy: autofix
rule:
  pattern: "$A.indexOf($X) === -1"
fix: "!$A.includes($X)"
skill_prose: |
  Test for absence with `!arr.includes(x)` rather than `arr.indexOf(x) === -1`. It
  reads as the boolean it is and avoids comparing an index. (See `prefer-includes`
  for the `!== -1` form and the `NaN` edge case — both are equivalent for working code.)
examples:
  bad: "const no = arr.indexOf(x) === -1;"
  good: "const no = !arr.includes(x);"
---
id: prefer-date-now
language: typescript
title: "Use `Date.now()` instead of `new Date().getTime()`"
why: "`Date.now()` returns the current epoch milliseconds directly; `new Date().getTime()` allocates a `Date` object just to read its time. They're exactly equivalent."
severity: info
fix_policy: autofix
rule:
  pattern: "new Date().getTime()"
fix: "Date.now()"
skill_prose: |
  Get the current timestamp with `Date.now()` instead of `new Date().getTime()` (or
  `+new Date()`). It skips the throwaway `Date` allocation and reads as 'now in ms'.
examples:
  bad: "const t = new Date().getTime();"
  good: "const t = Date.now();"
---
id: prefer-object-hasown
language: typescript
title: "Use `Object.hasOwn` instead of `Object.prototype.hasOwnProperty.call`"
why: "`Object.hasOwn(obj, key)` (ES2022) is the purpose-built, readable replacement for the `Object.prototype.hasOwnProperty.call(obj, key)` incantation used to safely check own properties."
severity: info
fix_policy: autofix
rule:
  pattern: "Object.prototype.hasOwnProperty.call($O, $K)"
fix: "Object.hasOwn($O, $K)"
skill_prose: |
  Check for an own property with `Object.hasOwn(obj, key)` instead of the verbose
  `Object.prototype.hasOwnProperty.call(obj, key)`. Both sidestep a shadowed or
  null-prototype `hasOwnProperty`, but `Object.hasOwn` says it in one call.
examples:
  bad: "const has = Object.prototype.hasOwnProperty.call(obj, key);"
  good: "const has = Object.hasOwn(obj, key);"
---
id: prefer-number-isfinite
language: typescript
title: "Use `Number.isFinite` instead of the global `isFinite`"
why: "The global `isFinite` coerces its argument first, so `isFinite(\"42\")` is `true`. `Number.isFinite` returns true only for actual finite numbers. No safe autofix: the two differ for non-number arguments."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "isFinite($X)"
skill_prose: |
  Use `Number.isFinite(x)`, not the global `isFinite(x)`. The global coerces first, so
  `isFinite("42")` is `true` and `isFinite(null)` is `true` — surprising for a finiteness
  check. `Number.isFinite` is false for any non-number. Wrap explicitly with
  `Number.isFinite(Number(x))` if you do want coercion.
examples:
  bad: "if (isFinite(n)) {\n  return;\n}"
  good: "if (Number.isFinite(n)) {\n  return;\n}"
---
id: parse-int-radix
language: typescript
title: "Always pass a radix to `parseInt`"
why: "`parseInt(s)` infers the base from the string, so a leading `0x` parses as hex and historically `0`-prefixed strings parsed as octal. Passing `10` makes the base explicit and predictable. No safe autofix: the intended radix is a judgment call."
severity: warn
fix_policy: warn-and-instruct
rule:
  pattern: "parseInt($X)"
skill_prose: |
  Always give `parseInt` an explicit radix: `parseInt(s, 10)`. Without it the base is
  inferred from the string's prefix, which is a footgun for user input. Use `Number(s)`
  or the unary `+s` when you want a full numeric parse rather than integer truncation.
examples:
  bad: "const n = parseInt(s);"
  good: "const n = parseInt(s, 10);"
---
id: no-new-wrappers
language: typescript
title: "Don't use `new` with `String`/`Number`/`Boolean`"
why: "`new String(x)` makes a wrapper *object*, not a primitive, so `typeof` is `\"object\"` and `new Boolean(false)` is truthy. Called without `new`, these are useful conversion functions. No safe autofix: dropping `new` is the fix but intent must be confirmed."
severity: warn
fix_policy: warn-and-instruct
rule:
  any:
    - pattern: "new String($$$ARGS)"
    - pattern: "new Number($$$ARGS)"
    - pattern: "new Boolean($$$ARGS)"
skill_prose: |
  Never call `String`/`Number`/`Boolean` with `new`. The constructor form builds a
  wrapper object — `typeof new String("x") === "object"`, and `new Boolean(false)` is
  truthy — which breaks equality and type checks. Call them as plain functions for
  conversion (`String(x)`, `Number(x)`, `Boolean(x)`) or use a literal.
examples:
  bad: "const s = new String(x);"
  good: "const s = String(x);"
---
id: prefer-unknown-in-catch
language: typescript
title: "Type a caught error as `unknown`, not `any`"
why: "A `catch` variable can be anything that was thrown, so `unknown` is the honest type and forces a narrowing check before use; `any` silently disables checking on it. A judgment call about how to narrow, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Type a caught error as `unknown` (the default under `useUnknownInCatchVariables`)
  rather than `any`: `catch (err: unknown)`. Anything can be thrown, so you must
  narrow before using it — `if (err instanceof Error) ...` — which is exactly the
  safety `any` would throw away.
---
id: prefer-as-const
language: typescript
title: "Use `as const` for literal/tuple constants"
why: "`as const` freezes a value to its narrowest literal type — readonly tuples, literal unions — instead of the widened `string`/`number[]`. Whether you want the narrow type is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Annotate fixed literal data with `as const` — `const ROLES = ["admin", "user"] as const;`
  — so it infers a readonly tuple of literal types (`readonly ["admin", "user"]`)
  rather than the widened `string[]`. This powers literal unions
  (`type Role = typeof ROLES[number]`) and prevents accidental mutation.
---
id: prefer-satisfies
language: typescript
title: "Use `satisfies` to check a value without widening it"
why: "`satisfies T` validates that a value conforms to `T` while preserving its specific inferred type; an annotation `: T` validates but widens to `T`, losing literal detail. A judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Use `satisfies` when you want a value checked against a type but keep its narrow
  inferred shape: `const config = { port: 8080 } satisfies Config;` lets you both
  catch typos *and* still see `config.port` as the literal `8080`. Prefer it over a
  `: Config` annotation, which would widen the properties.
---
id: prefer-type-imports
language: typescript
title: "Use `import type` for type-only imports"
why: "`import type { T }` marks an import as erasable, so bundlers and `isolatedModules` builds drop it cleanly and never emit a runtime dependency for something used only in type position. A judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When an import is used only in type positions, write `import type { User } from "./user"`
  (or `import { type User, makeUser }` for mixed). It guarantees the binding is erased at
  compile time, avoids accidental runtime imports and circular-dependency cycles, and is
  required under `verbatimModuleSyntax`/`isolatedModules`.
---
id: avoid-type-assertions
language: typescript
title: "Prefer narrowing over `as` type assertions"
why: "`value as T` overrides the checker without proof; if you're wrong the bug surfaces later at runtime. Type guards and narrowing prove the type instead. When an assertion is genuinely needed is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Reach for narrowing — `typeof`/`instanceof` checks, user-defined type guards
  (`x is T`), discriminant checks — before an `as` assertion. Assertions tell the
  compiler 'trust me' without evidence, so a wrong one becomes a runtime crash. Keep
  assertions for the rare cases the checker genuinely can't follow (and never reach
  for `as any` or double assertions `as unknown as T`).
---
id: prefer-readonly-array
language: typescript
title: "Use `readonly` arrays/properties for data you don't mutate"
why: "`readonly T[]` / `ReadonlyArray<T>` and `readonly` fields make immutability part of the type, so accidental mutation is a compile error and intent is documented. A design judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Mark arrays and object fields you don't intend to mutate as `readonly` —
  `function sum(xs: readonly number[])`, `readonly id: string`. It documents intent and
  turns accidental `push`/reassignment into a compile error. Use it especially on
  function parameters to promise you won't mutate the caller's data.
---
id: prefer-discriminated-unions
language: typescript
title: "Model variants with a discriminated union, not optional fields"
why: "A discriminated union (`{ kind: \"a\"; ... } | { kind: \"b\"; ... }`) lets the compiler narrow exhaustively and makes illegal states unrepresentable; a flat type with many optional fields allows nonsensical combinations. A modeling judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When a type has mutually exclusive shapes, model it as a discriminated union with a
  literal tag — `type Result = { ok: true; value: V } | { ok: false; error: E }` —
  instead of one object with a pile of optional fields. The tag lets TypeScript narrow
  each branch and flags missing cases in a `switch`, so illegal combinations can't compile.
---
id: prefer-record-type
language: typescript
title: "Type keyed objects with `Record<K, V>`"
why: "`Record<string, number>` states 'object whose values are numbers' concisely and precisely; an index signature written by hand (`{ [k: string]: number }`) is noisier. A small style judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Describe a dictionary-shaped object with `Record<K, V>` — `Record<string, User>`,
  `Record<Status, Handler>` — rather than spelling out an index signature. With a
  union key type it also forces you to cover every key. (For truly dynamic keys at
  runtime, prefer a `Map`; see `prefer-map-over-record`.)
---
id: no-empty-interface
language: typescript
title: "Don't declare an empty interface"
why: "`interface Foo {}` accepts any non-nullish value (it has no requirements), which usually signals a placeholder or a misunderstanding. Extend, alias, or remove it. A judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Avoid `interface Foo {}`. An interface with no members imposes no constraints, so it
  behaves like `unknown`-ish `{}` and rarely means what the author intended. If you're
  re-exporting a type, use `type Foo = Bar`; if extending, `interface Foo extends Bar {}`;
  if it's a placeholder, leave a TODO with a real shape instead.
---
id: prefer-explicit-return-types
language: typescript
title: "Annotate return types on exported functions"
why: "An explicit return type documents the contract, keeps inference from silently changing it when the body changes, and produces clearer errors at the definition rather than at distant call sites. Where it adds value is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Give exported/public functions an explicit return type — `export function load(): Config`
  — so the contract is stated, an accidental change to the body is caught at the
  definition, and editor hovers are stable. Local helpers can lean on inference; the
  payoff is largest at module and API boundaries.
---
id: no-else-after-return
language: typescript
title: "Drop `else` after a returning `if`"
why: "When the `if` branch ends in `return`/`throw`, the `else` is redundant and adds a level of nesting; the else-body can dedent to the main flow. A small structural judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When an `if` block ends by returning or throwing, drop the `else` and let the rest
  of the function continue at the outer level: `if (!ok) return; doWork();` instead of
  `if (!ok) { return; } else { doWork(); }`. It removes a nesting level and reads as a
  guard clause.
---
id: no-lonely-if
language: typescript
title: "Use `else if` instead of an `if` nested alone in an `else`"
why: "An `else` block whose only statement is an `if` should be written `else if`, which flattens the chain and reads as the multi-way branch it is. A style judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Collapse `else { if (cond) { ... } }` into `else if (cond) { ... }`. The lonely
  nested `if` adds a brace level and obscures that this is one `if`/`else if`/`else`
  ladder. (If the chain grows long or branches on one value, consider a `switch` or a
  lookup map instead.)
---
id: prefer-switch-statement
language: typescript
title: "Use `switch` (or a map) for long `else if` chains on one value"
why: "A chain of `else if` all testing the same variable against constants reads better as a `switch` (or a lookup table), which makes the dispatch obvious and lets the compiler check exhaustiveness over a union. A judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When several `else if`s all compare the same value to constants, switch to a
  `switch` statement or a lookup object/`Map`. A `switch` over a discriminated union
  also gives you exhaustiveness checking via a `never` default. Keep the `if` ladder
  when branches test different expressions or ranges.
---
id: no-param-reassign
language: typescript
title: "Avoid reassigning function parameters"
why: "Mutating a parameter detaches it from the value the caller passed, obscures data flow, and breaks `arguments`-mapping in non-strict code. Introducing a local is usually clearer. A judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Treat parameters as read-only inputs; assign to a clearly-named local instead of
  reassigning the parameter (`const normalized = raw.trim()` rather than `raw = raw.trim()`).
  It keeps the original argument visible for debugging and avoids surprising a reader who
  expects a parameter to mean what was passed. Mutating an object a parameter *points at*
  is a separate concern (see immutability).
---
id: limit-function-params
language: typescript
title: "Replace long parameter lists with an options object"
why: "A function with many positional parameters forces callers to remember order and pass meaningless `undefined`s for skipped options; a single options object names each argument at the call site. Where the threshold lies is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When a function takes more than ~3 parameters — especially several of the same type
  or several optional ones — accept a single options object: `createUser({ name, role,
  active })`. Call sites become self-documenting, argument order stops mattering, and
  adding an option doesn't churn every caller. Keep positional params for one or two
  obvious, required arguments.
---
id: prefer-error-cause
language: typescript
title: "Preserve the original error with the `cause` option"
why: "When you catch and rethrow a wrapped error, passing `{ cause: err }` keeps the original stack and message for debugging; dropping it loses the root cause. A judgment call about wrapping, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When you catch an error and throw a more meaningful one, chain the original with the
  `cause` option: `throw new Error("failed to load config", { cause: err })` (ES2022).
  Loggers and `Error.prototype.stack` surface the chain, so you keep the root cause
  instead of discarding it.
---
id: custom-error-classes
language: typescript
title: "Define custom `Error` subclasses for distinct failures"
why: "A dedicated `class NotFoundError extends Error` lets callers branch with `instanceof` and carry structured fields, instead of string-matching `error.message`. A design judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Give distinct failure modes their own `Error` subclass — `class ValidationError extends
  Error { constructor(public field: string) { super(`invalid ${field}`); this.name =
  "ValidationError"; } }`. Callers can then `catch`/`instanceof` precisely and read typed
  fields, rather than parsing `error.message`. Set `this.name` so logs identify the type.
---
id: prefer-string-pad
language: typescript
title: "Pad strings with `padStart`/`padEnd`"
why: "`str.padStart(n, '0')` / `padEnd` express alignment and zero-padding directly; hand-rolled loops or slice-and-concat tricks are longer and error-prone. A small judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Align or zero-pad strings with the built-ins — `String(n).padStart(2, "0")` for a
  two-digit field, `label.padEnd(20)` to align columns — instead of manual loops or
  `("00" + n).slice(-2)` tricks. They state the target width and fill character plainly.
---
id: prefer-trim-methods
language: typescript
title: "Use `trim`/`trimStart`/`trimEnd` for whitespace"
why: "The built-in trim methods remove leading/trailing whitespace clearly and correctly across Unicode whitespace; regex `replace(/^\\s+|\\s+$/g, \"\")` is noisier and easier to get wrong. A small judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Strip surrounding whitespace with `str.trim()`, or `trimStart()`/`trimEnd()` for one
  side, rather than a `replace(/^\s+|\s+$/g, "")` regex. The methods say what they do and
  handle the full Unicode whitespace set. (For trimming a *specific* prefix/suffix string,
  reach for `slice`/`replace`, not `trim`.)
---
id: no-deep-relative-imports
language: typescript
title: "Avoid deep `../../../` relative import chains"
why: "Long `../../../` paths are brittle (they break on any file move) and obscure where a module actually lives. Path aliases or package entry points are stabler. A project-structure judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Replace deep relative imports like `../../../core/utils` with a configured path alias
  (`@/core/utils` via `tsconfig` `paths`) or a package boundary. Deep chains break
  whenever a file moves and hide the real dependency. Keep short relative imports
  (`./sibling`, `../parent`) for genuinely local references.
---
id: avoid-barrel-files
language: typescript
title: "Use barrel `index.ts` re-export files sparingly"
why: "A barrel file that re-exports a whole directory can defeat tree-shaking, create import cycles, and slow type-checking and bundling as the project grows. Whether a barrel helps is a design judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Be cautious with barrel files (`index.ts` that `export *` a directory). They're
  convenient but can pull in far more than callers use (hurting tree-shaking), introduce
  circular imports, and inflate build/type-check times at scale. Prefer importing from the
  specific module; reserve barrels for small, stable public APIs of a package.
---
id: prefer-const-over-let
language: typescript
title: "Default to `const`; use `let` only when you reassign"
why: "`const` documents that a binding never changes, which removes a question for every reader and lets tooling catch accidental reassignment. Whether a binding is truly const depends on the code, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Declare with `const` by default and switch to `let` only where you actually
  reassign the binding. `const` tells the reader (and the compiler) the reference is
  fixed, eliminating a class of accidental-mutation bugs. (It constrains the binding,
  not the object — a `const` array can still be `.push`-ed.)
---
id: prefer-rest-over-arguments
language: typescript
title: "Use rest parameters instead of the `arguments` object"
why: "`arguments` is an array-like, not an array; it doesn't exist in arrow functions and defeats typing. Rest parameters (`...args`) are a real typed array. A judgment call on signature shape, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Collect variadic arguments with a rest parameter — `function f(...args: number[])`
  — instead of the legacy `arguments` object. `...args` is a real array (so `.map`,
  `.reduce`, spread all work), is properly typed, and is available in arrow functions
  where `arguments` is not.
---
id: prefer-default-parameters
language: typescript
title: "Use default parameters instead of in-body fallbacks"
why: "`function f(x = 10)` declares the default in the signature where callers and tooling see it; `x = x ?? 10` inside the body hides it. A judgment call (defaults only fire on `undefined`), so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Give optional parameters a default in the signature — `function greet(name = "world")`
  — instead of patching them in the body with `name = name ?? "world"`. The default is
  visible in the signature and in editor hints. (Remember a parameter default fires
  only for `undefined`, not for `null` or other falsy values.)
---
id: prefer-arrow-callbacks
language: typescript
title: "Prefer arrow functions for inline callbacks"
why: "Arrow functions are terse and capture the surrounding `this` lexically, avoiding the classic `function` callback `this`-rebinding bug. Whether a given function should be an arrow is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  For inline callbacks, prefer an arrow function — `items.map((x) => x.id)` — over a
  `function` expression. Arrows are shorter and, crucially, capture `this` lexically,
  so callbacks passed to event handlers and array methods don't lose their binding.
  Use a named `function` declaration when you need hoisting, a name in stack traces,
  or a dynamic `this`.
---
id: prefer-async-await
language: typescript
title: "Prefer `async`/`await` over `.then()` chains"
why: "`await` lets asynchronous code read top-to-bottom with normal control flow and `try`/`catch`; long `.then()/.catch()` chains obscure ordering and error paths. A style judgment, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  Write asynchronous logic with `async`/`await` so it reads sequentially and uses
  ordinary `try`/`catch` for errors, instead of threading callbacks through
  `.then().then().catch()`. Reach for explicit `.then`/`Promise` combinators when you
  genuinely want concurrency (`Promise.all`) or point-free composition.
---
id: prefer-promise-all
language: typescript
title: "Run independent awaits concurrently with `Promise.all`"
why: "Awaiting independent promises one after another serializes work that could overlap; `Promise.all` runs them concurrently and waits once. Whether the operations are truly independent is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  When several `await`ed operations don't depend on each other, start them together
  and await once: `const [a, b] = await Promise.all([getA(), getB()])`. Sequential
  `const a = await getA(); const b = await getB();` needlessly serializes them. Keep
  the sequential form when a later call genuinely needs an earlier result.
---
id: no-await-in-loop
language: typescript
title: "Avoid `await` inside a loop over independent work"
why: "Awaiting inside a `for` loop processes items strictly one at a time; if the iterations are independent they can run concurrently with `Promise.all(items.map(...))`. Whether iterations are independent is a judgment call, so it's taught."
severity: info
fix_policy: skill-only
skill_prose: |
  An `await` in a loop body serializes the iterations. When each iteration is
  independent, map to promises and await them together:
  `await Promise.all(items.map((x) => process(x)))`. Keep the sequential `for`/`await`
  when iterations depend on each other or you must throttle concurrency (then use a
  pool/`p-limit`).
