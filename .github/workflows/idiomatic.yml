# Dogfood: run `idiomatic check` on this repo. Builds from source so it's
# self-contained (no release dependency).
#
# DOWNSTREAM repos should instead install the prebuilt binary — see the README
# and the install step in the README's CI snippet:
#   curl -LsSf https://github.com/joeblackwaslike/idiomatic/releases/latest/download/idiomatic-cli-installer.sh | sh
name: idiomatic

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build idiomatic
        run: cargo build --release -p idiomatic-cli
      - name: Run idiomatic check
        run: |
          files=$(git ls-files '*.py' '*.ts' '*.tsx')
          if [ -n "$files" ]; then
            ./target/release/idiomatic check $files
          else
            echo "no python/typescript files to check"
          fi
